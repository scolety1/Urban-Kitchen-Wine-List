name: Publish beverage inventory

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-beverage-inventory
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pull approved public menu rows
        env:
          INVENTORY_API_URL: ${{ vars.INVENTORY_API_URL }}
        run: node scripts/pull-inventory.mjs
      - name: Build and validate menus
        run: |
          node scripts/enrich-wines.mjs
          node scripts/build-whiskey-release.mjs
          node --test tests/production-contract.test.mjs tests/public-release-privacy.test.mjs tests/whiskey-metadata.test.mjs tests/whiskey-recommend.test.mjs tests/whiskey-ui.test.mjs tests/wine-drawer.test.mjs scripts/guest-routes.test.mjs
      - name: Commit published menu snapshot
        run: |
          git config user.name "Urban Kitchen Menu Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add data/wines.csv data/wines.cleaned.csv data/wines.json data/whiskey.csv
          git diff --cached --quiet && exit 0
          git commit -m "Publish approved beverage inventory"
          git push
