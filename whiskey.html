<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="format-detection" content="telephone=no" />
    <title>Whiskey List</title>

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/table.css" />
    <link rel="stylesheet" href="css/drawer.css" />
    <link rel="stylesheet" href="css/language.css" />
    <link rel="stylesheet" href="css/whiskey.css" />
  </head>
  <body data-menu="whiskey" class="whiskey-theme-violet-red">
    <header id="top-bar">
      <div class="masthead" aria-label="Urban Kitchen Whiskey List">
        <div class="masthead-kicker">Urban Kitchen</div>
        <div class="masthead-title">Whiskey List</div>
        <nav class="menu-switcher" aria-label="Beverage menus">
          <a href="wine.html">Wine</a>
          <a href="whiskey.html" aria-current="page">Whiskey</a>
        </nav>
      </div>
      <div id="tabs"></div>
    </header>

    <main id="content">
      <div id="status" class="card menu-status" role="status" aria-live="polite">Loading Whiskey list…</div>
      <div class="wh-picker-bar">
        <button type="button" id="help-me-decide" class="wh-picker-open" aria-haspopup="dialog" disabled>Help me decide</button>
        <p class="wh-picker-hint">Answer a few questions to see up to three matches from bottles with verified details.</p>
      </div>
      <div id="picks"></div>
      <div id="menu"></div>
    </main>

    <script type="module" src="js/whiskey.js"></script>
  </body>
</html>
